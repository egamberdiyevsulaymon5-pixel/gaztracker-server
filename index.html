<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GazTracker — Jonli kuzatuv</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Leaflet (OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Socket.io mijoz -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; z-index: 1; }

  /* Yuqori karta: ism + holat */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(80,56,192,.95), rgba(80,56,192,0));
    display: flex; align-items: center; gap: 12px; color: #fff;
  }
  .ava {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who .hi { font-size: 11px; opacity: .8; }
  .who .nm { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    background: rgba(34,197,94,.25); border: 1px solid rgba(34,197,94,.5); color: #d6ffe5;
    flex-shrink: 0;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(1.4);} }
  /* Holat ranglari */
  .chip.s-move { background: rgba(34,197,94,.25); border-color: rgba(34,197,94,.5); color: #d6ffe5; }
  .chip.s-move .dot { background: #22c55e; }
  .chip.s-stop { background: rgba(245,166,35,.25); border-color: rgba(245,166,35,.5); color: #ffe9c2; }
  .chip.s-stop .dot { background: #f5a623; }
  .chip.s-done { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: #e8e8ef; }
  .chip.s-done .dot { background: #aaa; animation: none; }

  /* Pastki karta: holat matni */
  .infobar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
    padding: 16px; padding-bottom: 24px;
    background: linear-gradient(0deg, rgba(0,0,0,.55), transparent);
    color: #fff;
  }
  .info-card {
    background: rgba(255,255,255,.16); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.3); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .info-ic { font-size: 26px; }
  .info-t { font-size: 14px; font-weight: 700; }
  .info-d { font-size: 12px; opacity: .85; margin-top: 2px; }

  /* Yuk mashinasi belgisi */
  .truck-pin {
    width: 38px; height: 38px; border-radius: 50%;
    background: #6644ee; border: 3px solid #fff;
    box-shadow: 0 4px 16px rgba(102,68,238,.6);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .dest-pin {
    width: 22px; height: 22px; border-radius: 50%;
    background: #FF5722; border: 3px solid #fff;
    box-shadow: 0 3px 10px rgba(255,87,34,.6);
  }
</style>
</head>
<body>

  <div id="map"></div>

  <!-- Yuqori panel -->
  <div class="topbar">
    <div class="ava">👤</div>
    <div class="who">
      <div class="hi">Salom,</div>
      <div class="nm" id="userName">Mehmon 👋</div>
    </div>
    <div class="chip" id="statusChip"><span class="dot"></span><span id="chipText">Kutilmoqda</span></div>
  </div>

  <!-- Pastki panel -->
  <div class="infobar">
    <div class="info-card">
      <div class="info-ic">🚛</div>
      <div>
        <div class="info-t" id="statusT">Mashina kutilmoqda...</div>
        <div class="info-d" id="statusD">Haydovchi joylashuvni ulashganda xarita yangilanadi</div>
      </div>
    </div>
  </div>

<script>
(function () {
  // Sizning Render serveringiz manzili
  const SERVER_URL = "https://gaztracker-server.onrender.com";

  // Boshlang'ich markaz: Xorazm viloyati, Hazorasp tumani
  const DEFAULT_CENTER = [41.3170, 61.0670];
  const DEST = [41.3205, 61.0735]; // "Siz" (mijoz manzili) — demo uchun

  // ── Telegram WebApp: ism va to'liq ekran ──
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      const name = [u.first_name, u.last_name].filter(Boolean).join(" ");
      document.getElementById("userName").textContent = name + " 👋";
    }
  }

  // ── Xarita (sun'iy yo'ldosh / sputnik rejimi) ──
  const map = L.map("map", { zoomControl: false, attributionControl: false }).setView(DEFAULT_CENTER, 14);
  // Esri World Imagery — bepul sputnik tasviri (kalit talab qilinmaydi)
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Tiles © Esri"
  }).addTo(map);
  // Ko'cha nomlari sputnik ustiga (yengil yorliqlar)
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png", {
    maxZoom: 19, opacity: 0.9
  }).addTo(map);

  const truckIcon = L.divIcon({
    className: "", html: '<div class="truck-pin">🚛</div>',
    iconSize: [38, 38], iconAnchor: [19, 19]
  });
  const destIcon = L.divIcon({
    className: "", html: '<div class="dest-pin"></div>',
    iconSize: [22, 22], iconAnchor: [11, 11]
  });

  L.marker(DEST, { icon: destIcon }).addTo(map);
  let truckMarker = L.marker(DEFAULT_CENTER, { icon: truckIcon }).addTo(map);
  let animId = null;

  // ── Holatni ko'rsatish: Yo'lda / Tarqatmoqda / Yakunlangan ──
  const chip = document.getElementById("statusChip");
  const chipText = document.getElementById("chipText");
  const statusT = document.getElementById("statusT");
  const statusD = document.getElementById("statusD");
  const truckEl = () => truckMarker.getElement();

  function setStatus(state) {
    chip.classList.remove("s-move", "s-stop", "s-done");
    if (state === "move") {
      chip.classList.add("s-move"); chipText.textContent = "Yo'lda";
      statusT.textContent = "Mashina yo'lda 🟢";
      statusD.textContent = "Sizga tomon kelmoqda";
      if (truckEl()) truckEl().style.opacity = 1;
    } else if (state === "stop") {
      chip.classList.add("s-stop"); chipText.textContent = "Tarqatmoqda";
      statusT.textContent = "Tarqatmoqda 🟡";
      statusD.textContent = "Mashina to'xtadi — balon tarqatilmoqda";
      if (truckEl()) truckEl().style.opacity = 1;
    } else if (state === "done") {
      chip.classList.add("s-done"); chipText.textContent = "Yakunlangan";
      statusT.textContent = "Tarqatish yakunlandi ⚪️";
      statusD.textContent = "Mashina bugungi tarqatishni tugatdi";
      if (truckEl()) truckEl().style.opacity = .45;
    } else { // kutilmoqda
      chip.classList.add("s-done"); chipText.textContent = "Kutilmoqda";
      statusT.textContent = "Mashina hali yo'lga chiqmagan";
      statusD.textContent = "Haydovchi chiqqanda xarita yangilanadi";
      if (truckEl()) truckEl().style.opacity = .45;
    }
  }
  setStatus("wait");

  // ── Silliq harakat ──
  function moveTruck(lat, lng) {
    const from = truckMarker.getLatLng();
    const to = L.latLng(lat, lng);
    const dur = 1000, t0 = performance.now();
    if (animId) cancelAnimationFrame(animId);
    function ease(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
    function step(now){
      const p = Math.min((now - t0) / dur, 1), e = ease(p);
      truckMarker.setLatLng([from.lat+(to.lat-from.lat)*e, from.lng+(to.lng-from.lng)*e]);
      if (p < 1) animId = requestAnimationFrame(step);
      else map.panTo(to, { animate: true, duration: .6 });
    }
    animId = requestAnimationFrame(step);
  }
  // Eski nomni ham qoldiramiz (moslik uchun)
  window.updateDriverLocation = moveTruck;

  // ── Socket.io: serverdan holat + joylashuv ──
  if (typeof io !== "undefined") {
    const socket = io(SERVER_URL, { transports: ["websocket"] });
    socket.on("connect", () => console.log("Serverga ulandi"));
    socket.on("driverUpdate", (d) => {
      if (!d) return;
      if (!d.online) {
        // offline: yakunlangan yoki hali boshlanmagan
        setStatus(d.finished ? "done" : "wait");
        return;
      }
      // online: koordinata bo'lsa mashinani suramiz
      if (typeof d.lat === "number" && typeof d.lng === "number") {
        moveTruck(d.lat, d.lng);
      }
      setStatus(d.moving ? "move" : "stop");
    });
  }
})();
</script>
</body>
</html>
